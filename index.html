<script>


let tabela = document.getElementById("tabela");

// =============================================
// FUNÇÕES UTILITÁRIAS
// =============================================

// Gera um identificador único para cada linha (usado para saber o que já foi
// enviado à planilha e o que ainda está pendente)
function gerarId(){
  if(window.crypto && typeof window.crypto.randomUUID === "function"){
    return window.crypto.randomUUID();
  }
  return "row_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
}

// Garante que a linha tenha um id, criando um novo se necessário
function garantirId(linha){
  if(!linha.dataset.id){
    linha.dataset.id = gerarId();
  }
  return linha.dataset.id;
}

// Lê todos os campos de uma linha e devolve um objeto com os dados
function coletarDadosLinha(linha){
  return {
    id:         garantirId(linha),
    data:       linha.querySelector("input[type='date']")?.value || "",
    materia:    linha.querySelector(".materia")?.value || "",
    conteudo:   linha.querySelector(".conteudo")?.value || "",
    itemEdital: linha.querySelector(".itemEdital")?.value || "",
    inicio:     linha.querySelector(".inicio")?.value || "",
    termino:    linha.querySelector(".termino")?.value || "",
    total:      linha.querySelector(".total")?.textContent || ""
  };
}

// Uma linha é considerada vazia se nenhum campo relevante foi preenchido
function linhaVazia(registro){
  return !registro.data && !registro.materia && !registro.conteudo &&
         !registro.inicio && !registro.termino;
}

// "Assinatura" do conteúdo da linha: muda sempre que qualquer campo muda.
// É assim que detectamos que uma linha já enviada foi editada e precisa
// ser enviada de novo.
function calcularAssinatura(registro){
  return JSON.stringify({
    data: registro.data,
    materia: registro.materia,
    conteudo: registro.conteudo,
    itemEdital: registro.itemEdital,
    inicio: registro.inicio,
    termino: registro.termino,
    total: registro.total
  });
}

function obterAssinaturasEnviadas(){
  try{
    return JSON.parse(localStorage.getItem("planilha_assinaturas") || "{}");
  } catch(erro){
    return {};
  }
}

function salvarAssinaturasEnviadas(assinaturas){
  localStorage.setItem("planilha_assinaturas", JSON.stringify(assinaturas));
}

// Ids de linhas que o usuário removeu aqui mas que ainda não foram apagadas
// da planilha (ex.: sem internet na hora). São reenviados no próximo envio.
const CHAVE_EXCLUSOES = "planilha_exclusoes";

function obterExclusoesPendentes(){
  try{
    const lista = JSON.parse(localStorage.getItem(CHAVE_EXCLUSOES) || "[]");
    return Array.isArray(lista) ? lista : [];
  } catch(erro){
    return [];
  }
}

function salvarExclusoesPendentes(lista){
  localStorage.setItem(CHAVE_EXCLUSOES, JSON.stringify(lista));
}

// Registra que uma linha foi removida. Só entra na fila se ela já tinha sido
// enviada à planilha antes (linha nunca enviada não existe lá, nada a apagar).
// Devolve true se algo foi colocado na fila.
function registrarExclusao(id){
  if(!id) return false;
  const assinaturas = obterAssinaturasEnviadas();
  if(!(id in assinaturas)) return false;

  delete assinaturas[id];
  salvarAssinaturasEnviadas(assinaturas);

  const pendentes = obterExclusoesPendentes();
  if(!pendentes.includes(id)){
    pendentes.push(id);
    salvarExclusoesPendentes(pendentes);
  }
  return true;
}

// Verifica se existe alguma linha com dado novo/alterado ainda não enviado
function existePendenciaDeSincronizacao(){
  const assinaturas = obterAssinaturasEnviadas();
  let pendente = obterExclusoesPendentes().length > 0;
  tabela.querySelectorAll("tr").forEach(linha => {
    const registro = coletarDadosLinha(linha);
    if(linhaVazia(registro)) return;
    if(assinaturas[registro.id] !== calcularAssinatura(registro)){
      pendente = true;
    }
  });
  return pendente;
}

// Atualiza o ícone de status (✅ salvo / ⏳ pendente) de uma linha
function atualizarStatusLinha(linha){
  const badge = linha.querySelector(".status-linha");
  if(!badge) return;

  const registro = coletarDadosLinha(linha);

  if(linhaVazia(registro)){
    badge.classList.add("vazio");
    badge.textContent = "";
    badge.title = "";
    return;
  }

  const assinaturas = obterAssinaturasEnviadas();
  const salvo = assinaturas[registro.id] === calcularAssinatura(registro);

  badge.classList.remove("vazio");
  if(salvo){
    badge.textContent = "✅";
    badge.title = "Já salvo na planilha";
  } else {
    badge.textContent = "⏳";
    badge.title = "Ainda não salvo na planilha";
  }
}

function atualizarStatusTodasLinhas(){
  tabela.querySelectorAll("tr").forEach(atualizarStatusLinha);
}

// =============================================
// TOASTS (avisos discretos, sem travar a tela)
// =============================================
function mostrarToast(mensagem, tipo){
  const container = document.getElementById("toast-container");
  if(!container){ alert(mensagem); return; }

  const toast = document.createElement("div");
  toast.className = "toast " + (tipo || "info");
  toast.textContent = mensagem;
  container.appendChild(toast);

  // força o navegador a aplicar o estado inicial antes de animar
  requestAnimationFrame(() => toast.classList.add("mostrar"));

  setTimeout(() => {
    toast.classList.remove("mostrar");
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

function colorirElemento(el, materia){
  if(!el) return;
  let cor = coresMateria[materia];
  if(cor){
    el.style.background = cor.bg;
    el.style.color = cor.color;
  } else {
    el.style.background = "";
    el.style.color = "";
  }
}

function calcularHoras(linha){


let inicio =
linha.querySelector(".inicio").value;


let termino =
linha.querySelector(".termino").value;



if(inicio && termino){


let inicioMin =
converter(inicio);


let terminoMin =
converter(termino);



let diferenca =
terminoMin - inicioMin;

// sessão que cruza a meia-noite (ex: 23:00 → 01:00)
if(diferenca < 0){
  diferenca += 24 * 60;
}



if(diferenca>=0){


linha.querySelector(".total").innerHTML =
formatar(diferenca);


}

// aviso visual: duração maior que 12h provavelmente é erro de digitação
let celulaTotal = linha.querySelector(".total");
if(diferenca > 12 * 60){
  celulaTotal.classList.add("aviso-duracao");
  celulaTotal.title = "Duração maior que 12h. Confira os horários de início e término.";
} else {
  celulaTotal.classList.remove("aviso-duracao");
  celulaTotal.title = "";
}


}

else{


linha.querySelector(".total").innerHTML="";
linha.querySelector(".total").classList.remove("aviso-duracao");
linha.querySelector(".total").title = "";


}

atualizarTotalGeral();

}





function converter(hora){


let partes = hora.split(":");


return Number(partes[0])*60 +
Number(partes[1]);


}


function atualizarTotalGeral(){
  let totalMin = 0;
  document.querySelectorAll("#tabela .total").forEach(function(td){
    let txt = td.textContent.trim();
    if(txt && txt !== "Erro"){
      let partes = txt.split(":");
      if(partes.length === 2){
        let h = parseInt(partes[0], 10);
        let m = parseInt(partes[1], 10);
        if(!isNaN(h) && !isNaN(m)){
          totalMin += h * 60 + m;
        }
      }
    }
  });
  let horas = Math.floor(totalMin / 60);
  let min = totalMin % 60;
  let span = document.getElementById("totalHorasGeral");
  if(span) span.textContent = horas + ":" + String(min).padStart(2,"0");
}




function formatar(minutos){


let horas =
Math.floor(minutos/60);


let min =
minutos%60;



return horas + ":" +
String(min).padStart(2,"0");


}

function salvarDados(){
  let linhas = tabela.querySelectorAll("tr");
  let dados = [];
  linhas.forEach(linha => {
    let registro = coletarDadosLinha(linha);
    dados.push(registro);
  });
  localStorage.setItem("planejamento_estudos", JSON.stringify(dados));
}

function restaurarDados(){
  let salvo = localStorage.getItem("planejamento_estudos");
  let dados = salvo ? JSON.parse(salvo) : [];

  // se não há nada salvo, garante pelo menos uma linha em branco para começar
  if(dados.length === 0){
    if(tabela.querySelectorAll("tr").length === 0){
      adicionarLinha();
    }
    atualizarStatusTodasLinhas();
    return;
  }

  // garante que há linhas suficientes
  let linhas = tabela.querySelectorAll("tr");
  while(linhas.length < dados.length){
    adicionarLinha();
    linhas = tabela.querySelectorAll("tr");
  }

  dados.forEach((item, idx) => {
    let linha = linhas[idx];
    if(!linha) return;

    // id (usado para controlar o que já foi enviado à planilha)
    if(item.id) linha.dataset.id = item.id;

    // data
    let inputData = linha.querySelector("input[type='date']");
    if(inputData) inputData.value = item.data;

    // matéria
    let selectMateria = linha.querySelector(".materia");
    if(selectMateria && item.materia){
      selectMateria.value = item.materia;

      // dispara o preenchimento do select de conteúdo
      let campoConteudo = linha.querySelector(".conteudo");
      campoConteudo.innerHTML = '<option value="">Selecione o conteúdo</option>';
      if(conteudos[item.materia]){
        conteudos[item.materia].forEach(c => {
          let op = document.createElement("option");
          op.value = c; op.textContent = c;
          campoConteudo.appendChild(op);
        });
      }

      // aplica cores
      colorirMateria(selectMateria, item.materia);
      colorirConteudo(campoConteudo, item.materia);
      aplicarCorMateria(linha, item.materia);
      let campoItemEdital = linha.querySelector(".itemEdital");
      colorirElemento(campoItemEdital, item.materia);
    }

    // conteúdo
    let selectConteudo = linha.querySelector(".conteudo");
    if(selectConteudo && item.conteudo){
      selectConteudo.value = item.conteudo;
      let campoItemEdital = linha.querySelector(".itemEdital");
      if(campoItemEdital){
        campoItemEdital.value = itensEdital[item.materia]?.[item.conteudo] || "";
      }
    }

    // horários
    let inputInicio = linha.querySelector(".inicio");
    let inputTermino = linha.querySelector(".termino");
    if(inputInicio) inputInicio.value = item.inicio;
    if(inputTermino) inputTermino.value = item.termino;

    calcularHoras(linha);
    atualizarStatusLinha(linha);
  });
}

// Remove apenas a linha clicada (não afeta o que já foi salvo na planilha)
function removerLinha(botao){
  const linha = botao.closest("tr");
  if(!linha) return;

  const registro = coletarDadosLinha(linha);

  if(!linhaVazia(registro) && !confirm("Remover esta linha?\nSe ela já foi salva, também será apagada da planilha.")){
    return;
  }

  const precisaApagarNaPlanilha = registrarExclusao(registro.id);

  linha.remove();
  atualizarTotalGeral();
  salvarDados();

  if(precisaApagarNaPlanilha){
    enviarExclusoesPendentes().then(ok => {
      if(ok){
        mostrarToast("Linha removida do site e da planilha.", "sucesso");
      } else {
        mostrarToast("Linha removida aqui, mas não foi possível apagá-la da planilha agora. Será tentado de novo no próximo envio.", "erro");
      }
    });
  }
}

function limparDados(){
  if(confirm("Tem certeza que deseja apagar todos os dados?\nIsso também apaga da planilha o que já foi salvo. Essa ação não pode ser desfeita.")){
    // enfileira a exclusão, na planilha, de tudo que já tinha sido enviado
    tabela.querySelectorAll("tr").forEach(linha => registrarExclusao(linha.dataset.id));
    localStorage.removeItem("planejamento_estudos");
    // limpa todos os campos visualmente
    tabela.querySelectorAll("tr").forEach(linha => {
      let inputData = linha.querySelector("input[type='date']");
      let selectMateria = linha.querySelector(".materia");
      let selectConteudo = linha.querySelector(".conteudo");
      let itemEdital = linha.querySelector(".itemEdital");
      let inicio = linha.querySelector(".inicio");
      let termino = linha.querySelector(".termino");
      let total = linha.querySelector(".total");
      if(inputData) inputData.value = "";
      if(selectMateria){ selectMateria.value = ""; selectMateria.style.background=""; selectMateria.style.color=""; }
      if(selectConteudo){ selectConteudo.innerHTML='<option value="">Selecione o conteúdo</option>'; selectConteudo.style.background=""; selectConteudo.style.color=""; }
      if(itemEdital){ itemEdital.value = ""; itemEdital.style.background=""; itemEdital.style.color=""; }
      if(inicio) inicio.value = "";
      if(termino) termino.value = "";
      if(total){ total.innerHTML = ""; total.classList.remove("aviso-duracao"); total.title = ""; }
      // remove cor das células
      linha.querySelectorAll("td").forEach(td => { td.style.background=""; td.style.color=""; });
      // gera um novo id, já que o conteúdo antigo foi apagado
      linha.dataset.id = gerarId();
      atualizarStatusLinha(linha);
    });
    atualizarTotalGeral();
    mostrarToast("Dados apagados.", "info");
    enviarExclusoesPendentes().then(ok => {
      if(!ok && obterExclusoesPendentes().length > 0){
        mostrarToast("Não foi possível apagar na planilha agora. Será tentado de novo no próximo envio.", "erro");
      }
    });
  }
}

// Restaura ao carregar a página
window.addEventListener("load", function(){
  restaurarDados();
  // Busca na planilha do Google linhas que não existem neste navegador
  // (ex.: navegador limpo, ou aberto pela primeira vez em outro dispositivo)
  carregarDaPlanilha(true);
  // Restaura modo escuro salvo
  if(localStorage.getItem("darkMode") === "1"){
    document.body.classList.add("dark-mode");
    document.getElementById("iconDark").style.display = "none";
    document.getElementById("iconLight").style.display = "block";
  }
});

// Aviso ao fechar a aba, mas só se houver dado ainda não enviado à planilha
window.addEventListener("beforeunload", function(e){
  if(existePendenciaDeSincronizacao()){
    e.preventDefault();
    e.returnValue = "";
  }
});

function alternarModoEscuro(){
  const isDark = document.body.classList.toggle("dark-mode");
  document.getElementById("iconDark").style.display = isDark ? "none" : "block";
  document.getElementById("iconLight").style.display = isDark ? "block" : "none";
  localStorage.setItem("darkMode", isDark ? "1" : "0");
}

/* COLE AQUI */

const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwRwX4L65p6jHIgd_3e2BnUmeKvSARD-ED6WwU6k9x1z5J-3mnUl4p-eEm3x-FICsRf/exec";

// Envia um lote de linhas (array de objetos) para a planilha do Google
// Envia qualquer conteúdo ao Apps Script e confere a resposta ({ok:true}).
// Sem "no-cors": assim erros do script deixam de passar por sucesso.
async function enviarParaScript(payload){
  try{
    const resposta = await fetch(URL_SCRIPT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // requisição "simples": sem preflight
      body: JSON.stringify(payload)
    });
    if(!resposta.ok) return false;
    const json = await resposta.json();
    return !!(json && json.ok === true);
  } catch(erro){
    console.error("Erro ao falar com a planilha:", erro);
    return false;
  }
}

async function salvarGoogle(dados){
  if(!dados || dados.length === 0) return true;
  return enviarParaScript(dados);
}

// Apaga na planilha as linhas removidas aqui. Só tira da fila o que foi confirmado.
async function enviarExclusoesPendentes(){
  const pendentes = obterExclusoesPendentes();
  if(pendentes.length === 0) return true;

  const ok = await enviarParaScript({ acao: "excluir", ids: pendentes });
  if(ok){
    const restantes = obterExclusoesPendentes().filter(id => !pendentes.includes(id));
    salvarExclusoesPendentes(restantes);
  }
  return ok;
}

// Chamado pelo botão "Salvar na Planilha".
// Envia as linhas novas E as linhas que já foram enviadas antes mas foram
// editadas depois (detectado pela "assinatura" do conteúdo), evitando tanto
// duplicidade quanto o problema de uma correção não chegar até a planilha.
async function salvarNaPlanilha(){
  const btn = document.getElementById("btnSalvarPlanilha");
  if(btn){ btn.disabled = true; btn.textContent = "Salvando..."; }

  // 1) exclusões que ficaram pendentes (ex.: remoção feita sem internet)
  const havia = obterExclusoesPendentes().length > 0;
  const exclusoesOk = await enviarExclusoesPendentes();

  // 2) linhas novas ou alteradas
  const assinaturas = obterAssinaturasEnviadas();
  const novos = [];
  const novasAssinaturas = {};

  tabela.querySelectorAll("tr").forEach(linha => {
    const registro = coletarDadosLinha(linha);

    // ignora linhas totalmente vazias
    if(linhaVazia(registro)) return;

    const assinatura = calcularAssinatura(registro);

    if(assinaturas[registro.id] !== assinatura){
      novos.push(registro);
      novasAssinaturas[registro.id] = assinatura;
    }
  });

  if(novos.length === 0){
    if(havia && exclusoesOk){
      mostrarToast("Exclusões enviadas para a planilha.", "sucesso");
    } else if(havia && !exclusoesOk){
      mostrarToast("Não foi possível apagar na planilha. Verifique sua conexão e tente novamente.", "erro");
    } else {
      mostrarToast("Não há dados novos ou alterados para salvar.", "info");
    }
    if(btn){ btn.disabled = false; btn.textContent = "Salvar"; }
    return;
  }

  const ok = await salvarGoogle(novos);

  if(ok){
    // relê: a tabela pode ter mudado enquanto o envio estava em andamento
    const atuais = obterAssinaturasEnviadas();
    Object.assign(atuais, novasAssinaturas);
    salvarAssinaturasEnviadas(atuais);
    mostrarToast(novos.length + " linha(s) salva(s) na planilha com sucesso!", "sucesso");
  } else {
    mostrarToast("Houve um erro ao salvar na planilha. Verifique sua conexão e tente novamente.", "erro");
  }

  if(btn){ btn.disabled = false; btn.textContent = "Salvar"; }

  // mantém também o salvamento local e atualiza os selos de status
  salvarDados();
  atualizarStatusTodasLinhas();
}

// Busca os dados salvos na planilha do Google (via doGet no Apps Script) e
// preenche a tabela com as linhas que ainda não existem neste navegador.
// Não sobrescreve linhas que já existem localmente (mesmo id), para não
// apagar edições feitas neste navegador que ainda não foram enviadas.
async function carregarDaPlanilha(silencioso){
  const btn = document.getElementById("btnImportarPlanilha");
  if(btn){ btn.disabled = true; btn.textContent = "Importando..."; }

  try{
    // antes de ler, apaga na planilha o que foi removido aqui e ainda estava pendente
    await enviarExclusoesPendentes();

    const resposta = await fetch(URL_SCRIPT, { method: "GET" });

    if(!resposta.ok){
      throw new Error("Resposta HTTP " + resposta.status + " — verifique se o Apps Script foi reimplantado (Nova versão) com o doGet.");
    }

    const texto = await resposta.text();
    let json;
    try{
      json = JSON.parse(texto);
    } catch(erroParse){
      throw new Error("A resposta não é um JSON válido. Provavelmente o Apps Script ainda não tem o doGet implantado (ou a implantação não foi atualizada).");
    }

    // o doGet devolve {dados:[], erro:"..."} quando falha: não pode ser confundido
    // com "planilha vazia", senão apagaríamos linhas locais por engano
    if(json && json.erro){
      throw new Error("O Apps Script respondeu com erro: " + json.erro);
    }

    if(!json || !Array.isArray(json.dados)){
      throw new Error("A resposta do Apps Script não trouxe o campo 'dados'. Confira se o código do doGet foi colado corretamente.");
    }

    const assinaturas = obterAssinaturasEnviadas();
    const idsPlanilha = new Set(json.dados.map(d => d.id));
    const exclusoesPendentes = new Set(obterExclusoesPendentes());

    // Linhas que já tinham sido enviadas (têm assinatura) mas não existem mais
    // na planilha foram excluídas em outro lugar: remove também aqui.
    // Se a linha tiver edição local ainda não enviada, ela é mantida (fica ⏳).
    let removidas = 0;
    Array.from(tabela.querySelectorAll("tr")).forEach(linha => {
      const id = linha.dataset.id;
      if(!id || idsPlanilha.has(id) || !(id in assinaturas)) return;

      const igualAoEnviado = assinaturas[id] === calcularAssinatura(coletarDadosLinha(linha));
      delete assinaturas[id];
      if(igualAoEnviado){
        linha.remove();
        removidas++;
      }
    });

    if(tabela.querySelectorAll("tr").length === 0){
      adicionarLinha();
    }

    const idsLocais = new Set();
    tabela.querySelectorAll("tr").forEach(linha => {
      if(linha.dataset.id) idsLocais.add(linha.dataset.id);
    });

    let importadas = 0;

    json.dados.forEach(item => {
      if(!item.id || idsLocais.has(item.id)) return; // já existe localmente, não mexe
      if(exclusoesPendentes.has(item.id)) return;    // removida aqui, ainda não apagada na planilha

      // reaproveita a primeira linha em branco; só cria uma nova se não houver
      // nenhuma. Assim as linhas com dados ficam sempre antes das vazias.
      let linhaAlvo = Array.from(tabela.querySelectorAll("tr"))
        .find(l => linhaVazia(coletarDadosLinha(l)));
      if(!linhaAlvo){
        adicionarLinha();
        const novasLinhas = tabela.querySelectorAll("tr");
        linhaAlvo = novasLinhas[novasLinhas.length - 1];
      }

      linhaAlvo.dataset.id = item.id;

      let inputData = linhaAlvo.querySelector("input[type='date']");
      if(inputData) inputData.value = item.data || "";

      let selectMateria = linhaAlvo.querySelector(".materia");
      let campoConteudo = linhaAlvo.querySelector(".conteudo");
      if(selectMateria && item.materia){
        selectMateria.value = item.materia;
        campoConteudo.innerHTML = '<option value="">Selecione o conteúdo</option>';
        if(conteudos[item.materia]){
          conteudos[item.materia].forEach(c => {
            let op = document.createElement("option");
            op.value = c; op.textContent = c;
            campoConteudo.appendChild(op);
          });
        }
        colorirMateria(selectMateria, item.materia);
        colorirConteudo(campoConteudo, item.materia);
        aplicarCorMateria(linhaAlvo, item.materia);
      }

      if(campoConteudo && item.conteudo){
        campoConteudo.value = item.conteudo;
      }

      let campoItemEdital = linhaAlvo.querySelector(".itemEdital");
      if(campoItemEdital){
        campoItemEdital.value = item.itemEdital || (itensEdital[item.materia]?.[item.conteudo] || "");
        colorirElemento(campoItemEdital, item.materia);
      }

      let inputInicio = linhaAlvo.querySelector(".inicio");
      let inputTermino = linhaAlvo.querySelector(".termino");
      if(inputInicio) inputInicio.value = item.inicio || "";
      if(inputTermino) inputTermino.value = item.termino || "";

      calcularHoras(linhaAlvo);

      // marca a linha como já sincronizada, já que ela veio da própria planilha
      const registro = coletarDadosLinha(linhaAlvo);
      assinaturas[registro.id] = calcularAssinatura(registro);
      idsLocais.add(item.id);
      importadas++;
    });

    salvarAssinaturasEnviadas(assinaturas);
    salvarDados();
    atualizarTotalGeral();
    atualizarStatusTodasLinhas();

    if(importadas > 0){
      mostrarToast(importadas + " linha(s) importada(s) da planilha!", "sucesso");
    }
    if(removidas > 0){
      mostrarToast(removidas + " linha(s) removida(s) por terem sido excluídas da planilha.", "info");
    }
    if(importadas === 0 && removidas === 0 && !silencioso){
      mostrarToast(json.dados.length === 0
        ? "A planilha ainda não tem nenhum dado salvo."
        : "Nenhum dado novo encontrado na planilha (tudo já estava aqui).", "info");
    }
  } catch(erro){
    console.error("Erro ao carregar dados da planilha:", erro);
    if(!silencioso){
      mostrarToast("Erro ao importar: " + erro.message, "erro");
    }
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = "📥 Importar da Planilha"; }
  }
}
